apiVersion: apps/v1
kind: Deployment
metadata:
  name: meditrack-frontend
  labels:
    app: meditrack-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meditrack-frontend
  template:
    metadata:
      labels:
        app: meditrack-frontend
    spec:
      containers:
      - name: meditrack-frontend
        image: mediatrackacr.azurecr.io/meditrack-frontent:v1
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: BACKEND_URL
          value: "http://meditrack-backend-service:80"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"