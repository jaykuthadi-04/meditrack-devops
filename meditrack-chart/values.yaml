# Global settings
registry: mediatrackacr.azurecr.io

# Backend service
backend:
  name: meditrack-backend
  image: mediatrackacr.azurecr.io/meditrack-backend
  tag: v1
  port: 5000
  replicas: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "250m"
    limits:
      memory: "128Mi"
      cpu: "500m"

# Frontend service
frontend:
  name: meditrack-frontend
  image: mediatrackacr.azurecr.io/meditrack-frontent
  tag: v1
  port: 3000
  replicas: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "250m"
    limits:
      memory: "128Mi"
      cpu: "500m"

# Notification service
notification:
  name: meditrack-notification
  image: mediatrackacr.azurecr.io/meditrack-notification
  tag: v2
  port: 5002
  replicas: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "250m"
    limits:
      memory: "128Mi"
      cpu: "500m"