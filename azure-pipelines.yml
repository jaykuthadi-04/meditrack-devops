trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  acrName: 'mediatrackacr'
  acrLoginServer: 'mediatrackacr.azurecr.io'
  resourceGroup: 'meditrack-rg'
  aksCluster: 'meditrack-aks'

stages:
- stage: Build
  displayName: 'Build and Push Docker Images'
  jobs:
  - job: BuildPush
    displayName: 'Build and Push to ACR'
    steps:
    - task: AzureCLI@2
      displayName: 'Login to ACR'
      inputs:
        azureSubscription: 'meditrack-service-connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az acr login --name $(acrName)

    - task: Docker@2
      displayName: 'Build and Push Backend'
      inputs:
        containerRegistry: 'meditrack-acr-connection'
        repository: 'meditrack-backend'
        command: 'buildAndPush'
        Dockerfile: 'services/backend/Dockerfile'
        buildContext: 'services/backend'
        tags: |
          $(Build.BuildId)
          latest

    - task: Docker@2
      displayName: 'Build and Push Frontend'
      inputs:
        containerRegistry: 'meditrack-acr-connection'
        repository: 'meditrack-frontent'
        command: 'buildAndPush'
        Dockerfile: 'services/frontend/Dockerfile'
        buildContext: 'services/frontend'
        tags: |
          $(Build.BuildId)
          latest

    - task: Docker@2
      displayName: 'Build and Push Notification'
      inputs:
        containerRegistry: 'meditrack-acr-connection'
        repository: 'meditrack-notification'
        command: 'buildAndPush'
        Dockerfile: 'services/notification/Dockerfile'
        buildContext: 'services/notification'
        tags: |
          $(Build.BuildId)
          latest

- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: Build
  jobs:
  - job: Deploy
    displayName: 'Deploy to AKS using Helm'
    steps:
    - task: AzureCLI@2
      displayName: 'Deploy to AKS'
      inputs:
        azureSubscription: 'meditrack-service-connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster) --overwrite-existing
          helm upgrade --install meditrack ./meditrack-chart \
            --set backend.tag=$(Build.BuildId) \
            --set frontend.tag=$(Build.BuildId) \
            --set notification.tag=$(Build.BuildId)